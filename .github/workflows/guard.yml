name: Keep this repo to briefings

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject anything other than a briefing
        run: |
          bad=$(git ls-files | grep -vE '^(README.md|\.gitignore|briefings/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json|audio/brief_[0-9]{4}-[0-9]{2}-[0-9]{2}\.mp4|\.github/workflows/guard\.yml|\.claude/settings\.json|\.claude/agents/(country|ecosystem)-(vp|director|manager)\.md|claude/atlas/ledger/[A-Za-z0-9_-]+\.md|claude/atlas/reports/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md|claude/atlas/source-feeds\.json|claude/atlas/context/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md|claude/atlas/memory/threads\.md|claude/atlas/memory/chronicle\.md|claude/atlas/AGENTS\.md|claude/atlas/tools/[A-Za-z0-9_-]+\.php|claude/atlas/country-data/AGENTS\.md|claude/atlas/country-data/baseline\.json|claude/atlas/country-data/database\.json|claude/atlas/country-data/coverage\.json|claude/atlas/country-data/reports/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md|claude/atlas/registry/countries\.json|claude/atlas/registry/watch\.md|claude/atlas/ecosystem/AGENTS\.md|claude/atlas/ecosystem/baseline\.json|claude/atlas/ecosystem/database\.json|claude/atlas/ecosystem/coverage\.json|claude/atlas/ecosystem/reports/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md)$' || true)
          if [ -n "$bad" ]; then
            echo "These files do not belong in this repository:"
            echo "$bad"
            exit 1
          fi
      - name: Validate worldwide builder state
        run: php claude/atlas/tools/builders.php validate all
